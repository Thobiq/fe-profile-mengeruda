		<style>
			#splash-screen {
				position: fixed;
				inset: 0;
				background-color: #ffffff;
				z-index: 9999999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				transition: opacity 0.8s ease-in-out, visibility 0.8s;
				font-family: 'Montserrat', sans-serif;
			}
			.splash-circle {
				width: 110px;
				height: 110px;
				border-radius: 50%;
				background-color: #e5e7eb; /* light grey placeholder */
				margin-bottom: 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
			}
			.splash-circle img {
				width: 100%;
				height: 100%;
				object-fit: contain;
				padding: 10px;
			}
			.splash-title {
				font-family: 'Montserrat', sans-serif;
				font-size: 32px;
				font-weight: 700;
				color: #15803d;
				text-align: center;
				line-height: 1.2;
				margin-bottom: 20px;
				letter-spacing: -0.02em;
			}
			.splash-loading-area {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.splash-spinner {
				width: 22px;
				height: 22px;
				border: 3px solid #e5e7eb;
				border-top-color: #15803d;
				border-radius: 50%;
				animation: splash-spin 1s linear infinite;
			}
			.splash-text {
				font-family: 'Montserrat', sans-serif;
				color: #4b5563;
				font-size: 16px;
				font-weight: 500;
			}
			@keyframes splash-spin {
				to { transform: rotate(360deg); }
			}
			@media (max-width: 640px) {
				.splash-title { font-size: 24px; }
				.splash-circle { width: 90px; height: 90px; }
			}
		</style>

	<body data-sveltekit-preload-data="hover">
		<div id="splash-screen">
			<div class="splash-circle">
				<img id="splash-logo" src="/logo.png" alt="Logo" style="display: none;" onload="this.style.display='block'" onerror="this.style.display='none'"/>
			</div>
			<div class="splash-title">
				Selamat Datang di<br/>Website Resmi Desa Mengeruda
			</div>
			<div class="splash-loading-area">
				<div class="splash-spinner"></div>
				<div class="splash-text">Sedang memuat data</div>
			</div>
		</div>

		<script>
			let backendUrl = '%env.VITE_PUBLIC_BACKEND_URL%'.startsWith('%env') ? '' : '%env.VITE_PUBLIC_BACKEND_URL%';
			
			// Fallback jika env tidak terganti saat build (production)
			if (!backendUrl || backendUrl === 'http://localhost:8000') {
				if (window.location.hostname === 'mengeruda.id' || window.location.hostname === 'www.mengeruda.id') {
					backendUrl = 'https://api-profile.mengeruda.id';
				}
			}

			fetch((backendUrl || '') + '/api/village-profile')
				.then(r => r.json())
				.then(res => {
					let data = res.data || res;
					if (data && (data.logo_url || data.logo)) {
						let url = data.logo_url || data.logo;
						if (!url.startsWith('http')) {
							url = (backendUrl || '') + (url.startsWith('/') ? '' : '/') + (url.startsWith('storage') ? url : url.replace('/storage/', 'storage/'));
						}
						let el = document.getElementById('splash-logo');
						if (el) el.src = url;
						let fav = document.getElementById('dynamic-favicon');
						if (fav) fav.href = url;
					}
				}).catch(e => console.log('Splash logo & favicon fetch error', e));
		</script>

		<div style="display: contents">
			<script>
				{
					__sveltekit_vswdrn = {
						base: new URL("..", location).pathname.slice(0, -1),
						env: null
					};

					const element = document.currentScript.parentElement;

					import("../_app/env.js").then(({ env }) => {
						__sveltekit_vswdrn.env = env;

						Promise.all([
							import("../_app/immutable/entry/start.atNmmo_0.js"),
							import("../_app/immutable/entry/app.C_TOne4u.js")
						]).then(([kit, app]) => {
							kit.start(app, element);
						});
					});
				}
			</script>
		</div>
